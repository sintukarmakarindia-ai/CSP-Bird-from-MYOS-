<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>CSP Bird from MYOS</title>

    <!-- =========================
         PWA SETTINGS
    ========================== -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CSP Bird">

    <link rel="manifest" href="manifest.json">

    <style>

        /* =========================
           BASIC RESET
        ========================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }


        /* =========================
           SPLASH SCREEN
        ========================== */

        #splash-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 99999;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;

            /* পুরো ছবিটা দেখা যাবে */
            object-fit: contain;

            display: block;
        }


        /* =========================
           LOADING SCREEN
        ========================== */

        #loading-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            /* BLUE SCREEN */
            background: #0066ff;

            display: none;
            align-items: center;
            justify-content: center;

            z-index: 99998;
        }


        /* BIG SPINNER */

        .spinner {
            width: 90px;
            height: 90px;

            border: 10px solid rgba(255, 255, 255, 0.35);

            border-top: 10px solid #ffffff;

            border-radius: 50%;

            animation: spin 0.75s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           MAIN APP
        ========================== */

        #main-app {
            width: 100%;
            height: 100%;

            display: none;

            flex-direction: column;

            background: #ffffff;
        }


        /* =========================
           HEADER
        ========================== */

        .header {
            height: 50px;
            min-height: 50px;

            background-color: #ffffff;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto
                minmax(0, 1fr);

            align-items: center;

            padding: 0 10px;

            position: relative;

            z-index: 10;
        }


        /* =========================
           LEFT LOGO
        ========================== */

        .logo-left {
            justify-self: start;

            height: 50px;
            width: auto;

            max-width: 25vw;

            object-fit: contain;
        }


        /* =========================
           MIDDLE LOGO
        ========================== */

        .logo-middle {
            justify-self: center;

            height: 50px;
            width: auto;

            max-width: 65vw;

            object-fit: contain;
        }


        /* =========================
           RIGHT LOGO
        ========================== */

        .logo-right {
            justify-self: end;

            height: 50px;
            width: auto;

            max-width: 25vw;

            object-fit: contain;
        }


        /* =========================
           IFRAME CONTAINER
        ========================== */

        .iframe-container {
            width: 100%;

            height: calc(100% - 50px);

            flex: 1;

            overflow: hidden;
        }


        iframe {
            width: 100%;
            height: 100%;

            border: none;

            display: block;
        }


        /* =========================
           SAFE AREA FOR MOBILE
        ========================== */

        @supports (padding: env(safe-area-inset-top)) {

            .header {

                padding-top: env(safe-area-inset-top);

                height:
                    calc(50px + env(safe-area-inset-top));
            }

            .iframe-container {

                height:
                    calc(100% - 50px - env(safe-area-inset-top));
            }

        }

    </style>
</head>


<body>


    <!-- ==================================================
         1. SPLASH SCREEN
         DISPLAY TIME = 1.2 SECONDS
    =================================================== -->

    <div id="splash-screen">

        <img
            src="splash.jpg"
            alt="CSP Bird Splash"
        >

    </div>



    <!-- ==================================================
         2. BLUE LOADING SCREEN
         DISPLAY TIME = 0.8 SECONDS
    =================================================== -->

    <div id="loading-screen">

        <div class="spinner"></div>

    </div>



    <!-- ==================================================
         3. MAIN APPLICATION
    =================================================== -->

    <div id="main-app">


        <!-- HEADER -->

        <div class="header">


            <!-- LEFT LOGO -->

            <img
                src="logoleft.jpg"
                alt="Left Logo"
                class="logo-left"
            >


            <!-- MIDDLE LOGO -->

            <img
                src="logomiddle.jpg"
                alt="Middle Logo"
                class="logo-middle"
            >


            <!-- RIGHT LOGO -->

            <img
                src="logoright.jpg"
                alt="Right Logo"
                class="logo-right"
            >


        </div>



        <!-- PORTAL -->

        <div class="iframe-container">

            <iframe
                src="https://script.google.com/macros/s/AKfycbzvcBvSNyDcuLxXBz2EiFq22C704pqtuI70VefXm7WiywA8E6QrpEgGS2AYn1wFhqED/exec"
                allowfullscreen>
            </iframe>

        </div>


    </div>



    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script>


        /* ================================================
           SPLASH → LOADING → PORTAL
        ================================================= */

        window.addEventListener("load", function () {


            /*
             * STEP 1
             * Splash screen
             * 1.2 seconds
             */

            setTimeout(function () {


                const splash =
                    document.getElementById("splash-screen");

                const loading =
                    document.getElementById("loading-screen");


                splash.style.display = "none";

                loading.style.display = "flex";


                /*
                 * STEP 2
                 * Blue loading screen
                 * 0.8 seconds
                 */

                setTimeout(function () {


                    const mainApp =
                        document.getElementById("main-app");


                    loading.style.display = "none";

                    mainApp.style.display = "flex";


                }, 950);


            }, 1100);

        });



        /* ================================================
           PWA SERVICE WORKER
        ================================================= */

        if ("serviceWorker" in navigator) {


            window.addEventListener("load", function () {


                navigator.serviceWorker
                    .register("./service-worker.js")

                    .then(function (registration) {

                        console.log(
                            "PWA Service Worker registered:",
                            registration.scope
                        );

                    })

                    .catch(function (error) {

                        console.log(
                            "Service Worker registration failed:",
                            error
                        );

                    });


            });

        }


    </script>


</body>
</html>
